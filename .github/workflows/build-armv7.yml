name: Build ARMv7 Docker Image for GHCR

on:
  push:
    branches: [ "main" ] # 当推送到 main 分支时触发 (作为测试版 test)
    tags: [ "v*" ]       # 当发布形如 v1.0.0 的标签时触发 (作为稳定版 latest)
  workflow_dispatch:     # 允许手动触发

# 授予工作流向 GHCR 写入镜像的权限
permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. 设置 QEMU 模拟器（ARMv7 跨平台构建的核心依赖）
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm/v7

      # 2. 设置 Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. 登录到 GitHub Container Registry (ghcr.io)
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 4. 自动生成镜像的 Tags 标签
      # 如果是 main 分支，标记为 test-armv7
      # 如果是 v* 标签，标记为 latest-armv7 和 具体版本号-armv7
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            suffix=-armv7,onlatest=true
          tags: |
            type=raw,value=test,branch=main
            type=semver,pattern={{version}}
            type=raw,value=latest,event=tag

      # 5. 执行构建并推送到 ghcr.io
      - name: Build and push ARMv7 Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm/v7  # 严格限制：只构建并输出 armv7 架构
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 开启 GitHub Actions 缓存加速后续构建
          cache-from: type=gha
          cache-to: type=gha,mode=max
